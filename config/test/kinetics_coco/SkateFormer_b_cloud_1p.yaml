seed: 1
num_worker: 4
work_dir: ../work_dir/kinetics/coco/SkateFormer_b_cloud_1p/

phase: test

# feeder
feeder: feeders.feeder_kinetics_coco.Feeder
test_feeder_args:
  data_path: /data/k400_2d.pkl/k400_2d.pkl
  keypoint_path: /data/k400_kpfiles_2d
  split: test
  data_type: b
  window_size: 64
  p_interval: [0.95]
  thres: 64
  uniform: True
  partition: True
  debug: False
  num_people: 1
  num_person_in: 1

# model — 1-person architecture (M=1)
model: model.SkateFormer.SkateFormer_
model_args:
  num_classes: 400
  num_people: 1
  num_points: 17
  kernel_size: 7
  num_heads: 32
  attn_drop: 0.5
  head_drop: 0.0
  rel: True
  drop_path: 0.2
  type_1_size: [8, 17]
  type_2_size: [8, 17]
  type_3_size: [8, 17]
  type_4_size: [8, 17]
  mlp_ratio: 4.0
  index_t: True

# evaluation settings
device: [0]
test_batch_size: 160

# weights loaded from training output
weights: ../work_dir/kinetics/coco/SkateFormer_b_cloud_1p/best_model.pt
